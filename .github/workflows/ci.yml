name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bakeflow
          POSTGRES_PASSWORD: ci-local-only
          POSTGRES_DB: bakeflow_test
        ports: ['5432:5432']
        options: --health-cmd="pg_isready -U bakeflow -d bakeflow_test" --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      DATABASE_URL: postgresql://bakeflow:ci-local-only@localhost:5432/bakeflow_test
      DEMO_PASSWORD: ci-demo-only-password
      JWT_SECRET: ci-only-signing-key-not-for-deployment-123456
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:migrate
      - run: pnpm seed:minimal
      - run: pnpm --filter @bakeflow/shared --filter @bakeflow/database build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
